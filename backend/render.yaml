services:
  - type: web
    name: qr-patrol-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Africa/Kinshasa
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: QR_SECRET
        sync: false # à fixer une fois pour toutes (les QR imprimés en dépendent)
      - key: MEDIA_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: SCHEDULER_ENABLED
        value: true
